[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # pdfkit lee sus tipografías desde disco, por eso no se "empaqueta"
  external_node_modules = ["pdfkit"]

# Todo lo que empieza con /api/ lo atiende la función "api"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# El panel de la institución no debe aparecer en Google
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
